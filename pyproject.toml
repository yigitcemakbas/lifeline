[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeline"
version = "0.1.0"
description = "Urgency-aware communications orchestration for degraded networks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.40",
  "pydeck>=0.9",
  "pandas>=2.2",
  "networkx>=3.3",
  "pydantic>=2.8",
  "groq>=0.11",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "build>=1.2"]

[tool.setuptools.packages.find]
include = ["lifeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"lifeline/dashboard/*" = ["E501"]  # inline HTML templates

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["lifeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
